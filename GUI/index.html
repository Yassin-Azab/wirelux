<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Wirelux — Local Network Monitor. Real-time traffic visualization and process analytics." />
  <title>Wirelux — Network Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/Theme/tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 54px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
      z-index: 100;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-brand svg { width: 28px; height: 28px; }
    .header-brand-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--color-accent), var(--color-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 12px;
      color: var(--color-text-muted);
    }
    .header-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--color-green);
      box-shadow: 0 0 6px var(--color-green);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }
    #local-country-label {
      font-weight: 500;
      color: var(--color-accent);
    }
    #last-updated {
      font-family: var(--font-mono);
      font-size: 11px;
    }
    #row-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text-muted);
    }

    /* ── Main layout ─────────────────────────────────────────────────────────── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left panel: Map ─────────────────────────────────────────────────────── */
    #map-panel {
      flex: 1 1 60%;
      min-width: 0;
      position: relative;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
    }

    #map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #map-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .map-hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--color-text-muted);
      pointer-events: none;
      opacity: 0.6;
    }

    /* ── Divider ─────────────────────────────────────────────────────────────── */
    #divider {
      width: 1px;
      background: var(--color-border);
      flex-shrink: 0;
    }

    /* ── Right panel: Filters + Stats ────────────────────────────────────────── */
    #right-panel {
      flex: 0 0 380px;
      min-width: 300px;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      background: var(--color-surface);
      overflow: hidden;
    }

    /* ── Tooltip ─────────────────────────────────────────────────────────────── */
    #connection-tooltip {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    #connection-tooltip.visible {
      opacity: 1;
    }

    /* ── Loading overlay ─────────────────────────────────────────────────────── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--color-bg);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 0.5s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-ring {
      width: 48px; height: 48px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      font-size: 13px;
      color: var(--color-text-muted);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="loader-ring"></div>
  <div class="loader-text" id="loading-text">INITIALIZING WIRELUX…</div>
</div>

<div id="app">

  <!-- Header -->
  <header id="header">
    <div class="header-brand">
      <!-- Logo SVG -->
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="14" stroke="url(#lg1)" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="5" fill="url(#lg1)" opacity="0.9"/>
        <line x1="16" y1="2" x2="16" y2="8" stroke="url(#lg1)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="16" y1="24" x2="16" y2="30" stroke="url(#lg1)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="2" y1="16" x2="8" y2="16" stroke="url(#lg1)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="24" y1="16" x2="30" y2="16" stroke="url(#lg1)" stroke-width="1.5" stroke-linecap="round"/>
        <defs>
          <linearGradient id="lg1" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00d4ff"/>
            <stop offset="1" stop-color="#00ff88"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="header-brand-name">WIRELUX</span>
    </div>

    <div class="header-meta">
      <div class="header-status">
        <div class="status-dot"></div>
        <span>LIVE</span>
      </div>
      <span>Origin: <span id="local-country-label">Loading…</span></span>
      <span id="row-count"></span>
      <span id="last-updated"></span>
    </div>
  </header>

  <!-- Main content -->
  <main id="main">

    <!-- Left: Map panel -->
    <section id="map-panel">
      <div id="map-container"></div>
      <div class="map-hint">Drag to pan · Double-click to recenter</div>
    </section>

    <div id="divider"></div>

    <!-- Right: Filters + Process panel -->
    <aside id="right-panel">
      <div id="filters-container"></div>
      <div id="process-panel-container"></div>
    </aside>

  </main>
</div>

<!-- Tooltip (outside app for z-index) -->
<div id="connection-tooltip"></div>

<script type="module" src="/src/App/index.js"></script>
</body>
</html>
